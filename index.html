<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>二手交換平台｜留言私聊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, 'Helvetica Neue', sans-serif;
        }

        /* ========== 動態波波背景 (全螢幕漂浮圓點) ========== */
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #fef5e7 0%, #f7e9d7 100%);
            position: relative;
            overflow-x: hidden;
            padding: 2rem 1.5rem;
        }

        /* 動態波波容器 — 全螢幕覆蓋，不影響點擊 */
        .bubble-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, rgba(249, 115, 22, 0.3), rgba(249, 115, 22, 0.08));
            border-radius: 50%;
            animation: floatBubble linear infinite;
            backdrop-filter: blur(1px);
            will-change: transform;
        }

        @keyframes floatBubble {
            0% {
                transform: translateY(100vh) scale(0.6);
                opacity: 0;
            }
            20% {
                opacity: 0.5;
            }
            80% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-20vh) scale(1.2);
                opacity: 0;
            }
        }

        /* 主要內容區，位於波波之上 */
        .wrapper {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .platform-container {
            background: rgba(255, 252, 245, 0.94);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.2);
            padding: 2rem 2rem 2rem;
            border: 1px solid rgba(249, 115, 22, 0.25);
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 3px solid #f97316;
            display: inline-block;
            width: 100%;
        }
        .system-name {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #b45309, #f97316, #fdba74);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .tagline {
            color: #7c4f2b;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .form-panel {
            background: #ffffffdd;
            border-radius: 1.5rem;
            padding: 1.6rem 2rem;
            margin-bottom: 2.2rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #fde1bd;
        }
        .form-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            margin-bottom: 1rem;
        }
        .field {
            flex: 1;
            min-width: 200px;
        }
        .field label {
            display: block;
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 0.4rem;
            color: #5a3e28;
        }
        .field label .required {
            color: #f97316;
        }
        .field input, .field textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            border: 1.5px solid #ffe2c1;
            background: #fffef7;
            font-size: 0.95rem;
        }
        .field input:focus, .field textarea:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
        }
        .btn-submit {
            background: #f97316;
            width: 100%;
            margin-top: 0.8rem;
            border: none;
            padding: 0.8rem;
            border-radius: 2rem;
            font-weight: 700;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-submit:hover {
            background: #ea580c;
            transform: translateY(-2px);
        }

        .filter-section {
            display: flex;
            justify-content: center;
            gap: 0.9rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .filter-chip {
            background: #f0e7db;
            border: none;
            padding: 0.5rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #5a3e28;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-chip.active-filter {
            background: #f97316;
            color: white;
            box-shadow: 0 4px 10px rgba(249,115,22,0.3);
        }
        .filter-chip:hover:not(.active-filter) {
            background: #f6dfc3;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1.8rem;
        }
        .record-card {
            background: white;
            border-radius: 1.5rem;
            overflow: hidden;
            transition: 0.2s ease;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
            border: 1px solid #ffdead;
            display: flex;
            flex-direction: column;
        }
        .record-card:hover {
            transform: translateY(-5px);
        }
        .card-inner {
            padding: 1.2rem 1.3rem 0.8rem 1.3rem;
        }
        .card-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 0.6rem;
        }
        .item-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: #2b241c;
        }
        .status-pill {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 30px;
            background: #eef2ff;
            color: #1e40af;
        }
        .status-pill.done-status {
            background: #d1fae5;
            color: #065f46;
        }
        .field-row {
            margin: 10px 0;
            font-size: 0.9rem;
            color: #4b3a2a;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .field-label {
            font-weight: 700;
            min-width: 65px;
            color: #a55c2a;
        }
        .meta {
            font-size: 0.7rem;
            color: #ac8e6f;
            border-top: 1px solid #ffe1c2;
            margin-top: 10px;
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-toggle {
            background: #fff0e0;
            border: none;
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            color: #f97316;
        }
        .btn-toggle:hover {
            background: #f97316;
            color: white;
        }

        .comment-section {
            background: #fefaf5;
            border-top: 1px solid #ffefda;
            padding: 0.9rem 1.2rem 1rem;
            margin-top: 0.5rem;
        }
        .comment-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #b45309;
            margin-bottom: 0.6rem;
        }
        .comment-form {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
        }
        .comment-name {
            width: 100px;
            padding: 0.5rem 0.7rem;
            border-radius: 2rem;
            border: 1.5px solid #ffe2c1;
            font-size: 0.75rem;
            background: white;
        }
        .comment-text {
            flex: 1;
            padding: 0.5rem 0.7rem;
            border-radius: 2rem;
            border: 1.5px solid #ffe2c1;
            font-size: 0.75rem;
            background: white;
        }
        .btn-comment {
            background: #f97316;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
        }
        .comment-list {
            max-height: 180px;
            overflow-y: auto;
        }
        .comment-item {
            background: white;
            border-radius: 1rem;
            padding: 0.5rem 0.8rem;
            margin-bottom: 0.5rem;
            border: 1px solid #ffefda;
            font-size: 0.75rem;
        }
        .comment-name-link {
            font-weight: 700;
            color: #f97316;
            cursor: pointer;
            text-decoration: underline;
        }
        .comment-name-link:hover {
            color: #ea580c;
        }
        .comment-content {
            color: #4b3a2a;
            margin: 4px 0;
        }
        .comment-time {
            font-size: 0.6rem;
            color: #bc9a7a;
            text-align: right;
        }
        .empty-comment {
            font-size: 0.7rem;
            color: #bc9a7a;
            text-align: center;
            padding: 0.5rem;
        }
        .empty-msg {
            text-align: center;
            padding: 3rem;
            background: #fff6ea;
            border-radius: 2rem;
            color: #ad8b6a;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #b48b65;
        }

        /* 聊天室模態框 */
        .chat-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 90%;
            max-width: 450px;
            height: 550px;
            background: white;
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: popIn 0.2s ease;
        }
        @keyframes popIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .chat-header {
            background: #f97316;
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h3 {
            font-size: 1rem;
        }
        .chat-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background: #fef9ef;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .chat-bubble {
            max-width: 80%;
            padding: 0.6rem 0.9rem;
            border-radius: 1.2rem;
            font-size: 0.85rem;
            word-break: break-word;
        }
        .chat-bubble.seller {
            background: #f97316;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0.3rem;
        }
        .chat-bubble.buyer {
            background: #e5e7eb;
            color: #1f2937;
            align-self: flex-start;
            border-bottom-left-radius: 0.3rem;
        }
        .chat-input-area {
            display: flex;
            padding: 0.8rem;
            gap: 0.5rem;
            background: white;
            border-top: 1px solid #ffefda;
        }
        .chat-input {
            flex: 1;
            padding: 0.6rem;
            border-radius: 2rem;
            border: 1.5px solid #ffe2c1;
            font-size: 0.85rem;
        }
        .chat-send {
            background: #f97316;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        @media (max-width: 640px) {
            .platform-container { padding: 1.2rem; }
            .cards-container { grid-template-columns: 1fr; }
            .comment-form { flex-direction: column; }
            .comment-name { width: 100%; }
        }
    </style>
</head>
<body>

<!-- 全螢幕動態波波背景 -->
<div class="bubble-bg" id="bubbleBg"></div>

<div class="wrapper">
    <div class="platform-container">
        <div class="brand">
            <div class="system-name">📦 二手交換平台</div>
            <div class="tagline">💬 匿名留言 · 點擊名字開啟私聊</div>
        </div>

        <div class="form-panel">
            <div class="form-grid">
                <div class="field">
                    <label>📌 物品名稱 <span class="required">*</span></label>
                    <input type="text" id="itemNameInput" placeholder="例: 二手木吉他">
                </div>
                <div class="field">
                    <label>🏷️ 分類 <span class="required">*</span></label>
                    <input type="text" id="categoryInput" placeholder="例: 樂器">
                </div>
                <div class="field">
                    <label>✏️ 賣家聯絡方式</label>
                    <textarea id="remarkInput" rows="1" placeholder="Line ID / 電話 (買家點擊留言者會看到)"></textarea>
                </div>
            </div>
            <button class="btn-submit" id="addRecordBtn">＋ 上架物品</button>
        </div>

        <div class="filter-section">
            <button class="filter-chip" data-filter="all">📋 全部</button>
            <button class="filter-chip" data-filter="active">🟢 上架中</button>
            <button class="filter-chip" data-filter="done">✅ 已售出</button>
        </div>

        <div id="recordsList" class="cards-container"></div>
        <footer>📢 點擊匿名者名字即可開啟聊天室，與對方私訊聯絡</footer>
    </div>
</div>

<!-- 聊天室模態框 -->
<div id="chatModal" class="chat-modal">
    <div class="chat-container">
        <div class="chat-header">
            <h3 id="chatTitle">正在與 匿名者 聊天</h3>
            <button class="chat-close" id="chatCloseBtn">&times;</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="輸入訊息...">
            <button class="chat-send" id="chatSendBtn">發送</button>
        </div>
    </div>
</div>

<script>
    // ======================= 二手交換平台 + 留言區 + 聊天室 =======================
    const STORAGE_KEY = "records";
    let currentFilter = "all";
    
    // 聊天室狀態 (臨時記憶，刷新消失)
    let activeChat = {
        recordId: null,
        commenterName: null,
        messages: []  // { sender: "seller" or "buyer", text, time }
    };

    function generateId() {
        return Date.now() + '_' + Math.random().toString(36).substring(2, 8);
    }

    function createRecord(formData) {
        return {
            id: generateId(),
            createdAt: new Date().toISOString(),
            status: "active",
            itemName: formData.itemName.trim(),
            category: formData.category.trim(),
            remark: formData.remark ? formData.remark.trim() : "",
            comments: []
        };
    }

    function loadData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (!stored) return [];
        try {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed)) {
                return parsed.map(record => {
                    if (!record.comments) record.comments = [];
                    return record;
                });
            }
            return [];
        } catch(e) { return []; }
    }

    function saveAllRecords(records) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function addRecord(record) {
        let records = loadData();
        records.push(record);
        saveAllRecords(records);
    }

    function updateRecord(id, changes) {
        let records = loadData();
        const idx = records.findIndex(r => r.id === id);
        if (idx === -1) return false;
        records[idx] = { ...records[idx], ...changes };
        saveAllRecords(records);
        applyCurrentFilterAndRender();
        return true;
    }

    function addCommentToRecord(recordId, commentName, commentContent) {
        if (!commentName.trim() || !commentContent.trim()) return false;
        let records = loadData();
        const idx = records.findIndex(r => r.id === recordId);
        if (idx === -1) return false;
        const newComment = {
            id: generateId(),
            name: commentName.trim().substring(0, 20),
            content: commentContent.trim().substring(0, 200),
            createdAt: new Date().toISOString()
        };
        if (!records[idx].comments) records[idx].comments = [];
        records[idx].comments.unshift(newComment);
        saveAllRecords(records);
        applyCurrentFilterAndRender();
        return true;
    }

    // 打開聊天室 (點擊匿名者名字)
    function openChatRoom(recordId, commenterName, sellerRemark, itemName) {
        const records = loadData();
        const record = records.find(r => r.id === recordId);
        if (!record) return;
        
        activeChat = {
            recordId: recordId,
            commenterName: commenterName,
            messages: []
        };
        
        const modal = document.getElementById("chatModal");
        const chatTitle = document.getElementById("chatTitle");
        chatTitle.innerText = `💬 與「${commenterName}」聊 ${itemName}`;
        
        const messagesDiv = document.getElementById("chatMessages");
        messagesDiv.innerHTML = "";
        
        if (record.remark) {
            addChatMessage("system", `📞 賣家聯絡方式：${record.remark}`, messagesDiv);
        }
        addChatMessage("system", `✨ 開始與 ${commenterName} 的對話，互相留 Line ID 或電話吧！`, messagesDiv);
        
        modal.style.display = "flex";
    }
    
    function addChatMessage(sender, text, container) {
        const msgDiv = document.createElement("div");
        if (sender === "seller") {
            msgDiv.className = "chat-bubble seller";
            msgDiv.innerText = `🛒 我：${text}`;
        } else if (sender === "buyer") {
            msgDiv.className = "chat-bubble buyer";
            msgDiv.innerText = `👤 ${activeChat.commenterName}：${text}`;
        } else {
            msgDiv.className = "chat-bubble buyer";
            msgDiv.style.background = "#f0e7db";
            msgDiv.style.color = "#7c4f2b";
            msgDiv.innerText = `📢 ${text}`;
        }
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }
    
    function sendChatMessage() {
        const input = document.getElementById("chatInput");
        const text = input.value.trim();
        if (!text) return;
        
        const messagesDiv = document.getElementById("chatMessages");
        addChatMessage("seller", text, messagesDiv);
        input.value = "";
    }
    
    function closeChatRoom() {
        document.getElementById("chatModal").style.display = "none";
        activeChat = { recordId: null, commenterName: null, messages: [] };
    }

    function renderList(recordsToShow) {
        const container = document.getElementById("recordsList");
        if (!container) return;
        if (!recordsToShow.length) {
            container.innerHTML = `<div class="empty-msg">🌟 目前沒有物品，趕快上架一件二手好物吧！</div>`;
            return;
        }

        const sorted = [...recordsToShow].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
        container.innerHTML = sorted.map(record => {
            const isDone = record.status === "done";
            const statusText = isDone ? "✅ 已售出" : "🟢 上架中";
            const statusClass = isDone ? "done-status" : "";
            const remarkDisplay = record.remark && record.remark.trim() !== "" 
                ? `<div class="field-row"><span class="field-label">📞 賣家</span><span>${escapeHtml(record.remark)}</span></div>` 
                : `<div class="field-row"><span class="field-label">📞 賣家</span><span style="color:#bc9a7a;">未提供</span></div>`;
            
            const createdDate = new Date(record.createdAt);
            const dateStr = `${createdDate.getMonth()+1}/${createdDate.getDate()} ${createdDate.getHours().toString().padStart(2,'0')}:${createdDate.getMinutes().toString().padStart(2,'0')}`;
            
            const comments = record.comments || [];
            const commentsListHtml = comments.length === 0 
                ? `<div class="empty-comment">✨ 暫無留言，來當第一個詢問的人～</div>`
                : comments.map(c => {
                    const commentDate = new Date(c.createdAt);
                    const timeStr = `${commentDate.getMonth()+1}/${commentDate.getDate()} ${commentDate.getHours().toString().padStart(2,'0')}:${commentDate.getMinutes().toString().padStart(2,'0')}`;
                    return `
                        <div class="comment-item">
                            <div><span class="comment-name-link" data-record-id="${record.id}" data-name="${escapeHtml(c.name)}" data-seller-remark="${escapeHtml(record.remark || '')}" data-item-name="${escapeHtml(record.itemName)}">📝 ${escapeHtml(c.name)}</span> 說：</div>
                            <div class="comment-content">💬 ${escapeHtml(c.content)}</div>
                            <div class="comment-time">${timeStr}</div>
                        </div>
                    `;
                }).join("");
            
            return `
                <div class="record-card" data-id="${record.id}">
                    <div class="card-inner">
                        <div class="card-title">
                            <span class="item-name">📦 ${escapeHtml(record.itemName)}</span>
                            <span class="status-pill ${statusClass}">${statusText}</span>
                        </div>
                        <div class="field-row">
                            <span class="field-label">🏷️ 分類</span>
                            <span>${escapeHtml(record.category)}</span>
                        </div>
                        ${remarkDisplay}
                        <div class="meta">
                            <span>🕒 ${dateStr}</span>
                            <button class="btn-toggle" data-id="${record.id}" data-status="${record.status}">
                                ${record.status === "active" ? "🔁 標記已售出" : "🔄 重新上架"}
                            </button>
                        </div>
                    </div>
                    <div class="comment-section">
                        <div class="comment-title">💬 匿名留言區 · 點擊名字開啟聊天室</div>
                        <div class="comment-form">
                            <input type="text" class="comment-name" id="commentName_${record.id}" placeholder="匿名稱呼" maxlength="20">
                            <input type="text" class="comment-text" id="commentText_${record.id}" placeholder="留言內容 + 您的Line/電話...">
                            <button class="btn-comment" data-id="${record.id}">留言</button>
                        </div>
                        <div class="comment-list" id="commentList_${record.id}">
                            ${commentsListHtml}
                        </div>
                    </div>
                </div>
            `;
        }).join("");

        document.querySelectorAll(".btn-toggle").forEach(btn => {
            btn.removeEventListener("click", handleToggle);
            btn.addEventListener("click", handleToggle);
        });
        document.querySelectorAll(".btn-comment").forEach(btn => {
            btn.removeEventListener("click", handleAddComment);
            btn.addEventListener("click", handleAddComment);
        });
        document.querySelectorAll(".comment-name-link").forEach(link => {
            link.removeEventListener("click", handleNameClick);
            link.addEventListener("click", handleNameClick);
        });
    }

    function handleToggle(event) {
        const btn = event.currentTarget;
        const id = btn.getAttribute("data-id");
        const currentStatus = btn.getAttribute("data-status");
        const newStatus = currentStatus === "active" ? "done" : "active";
        updateRecord(id, { status: newStatus });
    }

    function handleAddComment(event) {
        const btn = event.currentTarget;
        const recordId = btn.getAttribute("data-id");
        const nameInput = document.getElementById(`commentName_${recordId}`);
        const textInput = document.getElementById(`commentText_${recordId}`);
        if (!nameInput || !textInput) return;
        const name = nameInput.value.trim();
        const content = textInput.value.trim();
        if (!name) { alert("請輸入匿名稱呼"); return; }
        if (!content) { alert("請輸入留言內容"); return; }
        addCommentToRecord(recordId, name, content);
        nameInput.value = "";
        textInput.value = "";
    }

    function handleNameClick(event) {
        const link = event.currentTarget;
        const recordId = link.getAttribute("data-record-id");
        const commenterName = link.getAttribute("data-name");
        const sellerRemark = link.getAttribute("data-seller-remark");
        const itemName = link.getAttribute("data-item-name");
        openChatRoom(recordId, commenterName, sellerRemark, itemName);
    }

    function applyCurrentFilterAndRender() {
        const allRecords = loadData();
        let filtered = [];
        if (currentFilter === "all") filtered = allRecords;
        else if (currentFilter === "active") filtered = allRecords.filter(r => r.status === "active");
        else filtered = allRecords.filter(r => r.status === "done");
        renderList(filtered);
    }

    function setFilterAndRender(filterValue) {
        currentFilter = filterValue;
        document.querySelectorAll(".filter-chip").forEach(btn => {
            const val = btn.getAttribute("data-filter");
            if (val === filterValue) btn.classList.add("active-filter");
            else btn.classList.remove("active-filter");
        });
        applyCurrentFilterAndRender();
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // 全螢幕動態波波產生器 (數量更多，分布整個畫面)
    function createBubbles() {
        const bg = document.getElementById("bubbleBg");
        if (!bg) return;
        bg.innerHTML = "";
        // 增加泡泡數量，讓背景更豐富 (40~55顆)
        const bubbleCount = Math.floor(Math.random() * 20) + 45; // 45~65 顆
        for (let i = 0; i < bubbleCount; i++) {
            const bubble = document.createElement("div");
            bubble.classList.add("bubble");
            const size = Math.random() * 80 + 25; // 25px ~ 105px
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 100}%`;
            bubble.style.animationDuration = `${Math.random() * 14 + 7}s`; // 7~21秒
            bubble.style.animationDelay = `${Math.random() * 20}s`;
            bubble.style.opacity = Math.random() * 0.5 + 0.2;
            bg.appendChild(bubble);
        }
    }

    // 定時刷新泡泡，保持動態感 (每18秒重生一批，讓泡泡持續流動)
    let bubbleInterval;
    function startBubbleAnimation() {
        createBubbles();
        if (bubbleInterval) clearInterval(bubbleInterval);
        bubbleInterval = setInterval(() => {
            createBubbles();
        }, 18000);
    }

    function init() {
        if (!localStorage.getItem(STORAGE_KEY)) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify([]));
        }
        currentFilter = "all";
        applyCurrentFilterAndRender();
        
        // 啟動全螢幕波波背景
        startBubbleAnimation();

        document.querySelectorAll(".filter-chip").forEach(btn => {
            btn.addEventListener("click", () => {
                setFilterAndRender(btn.getAttribute("data-filter"));
            });
        });
        document.querySelector(".filter-chip[data-filter='all']")?.classList.add("active-filter");

        const addBtn = document.getElementById("addRecordBtn");
        addBtn.addEventListener("click", () => {
            const itemName = document.getElementById("itemNameInput").value;
            const category = document.getElementById("categoryInput").value;
            const remark = document.getElementById("remarkInput").value;
            if (!itemName.trim()) { alert("請填寫物品名稱"); return; }
            if (!category.trim()) { alert("請填寫分類"); return; }
            const newRecord = createRecord({ itemName, category, remark });
            addRecord(newRecord);
            document.getElementById("itemNameInput").value = "";
            document.getElementById("categoryInput").value = "";
            document.getElementById("remarkInput").value = "";
            applyCurrentFilterAndRender();
        });

        ["itemNameInput", "categoryInput", "remarkInput"].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener("keypress", (e) => { if (e.key === "Enter") addBtn.click(); });
        });

        document.getElementById("chatCloseBtn").addEventListener("click", closeChatRoom);
        document.getElementById("chatSendBtn").addEventListener("click", sendChatMessage);
        document.getElementById("chatInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendChatMessage();
        });
        document.getElementById("chatModal").addEventListener("click", (e) => {
            if (e.target === document.getElementById("chatModal")) closeChatRoom();
        });
    }

    init();
</script>
</body>
</html>
